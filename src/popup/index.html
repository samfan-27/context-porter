<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContextPorter</title>
    <style>
      body {
        margin: 0;
        width: 380px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #111827;
        color: #e5e7eb;
      }

      #app {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
      }

      #status {
        margin: 0;
        font-size: 13px;
        color: #9ca3af;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 9px 12px;
        background: #374151;
        color: #fff;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      textarea {
        width: 100%;
        min-height: 240px;
        box-sizing: border-box;
        resize: vertical;
        border-radius: 10px;
        border: 1px solid #374151;
        background: #0b1220;
        color: #e5e7eb;
        padding: 10px;
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>ContextPorter</h1>
      <p id="status">Ready.</p>

      <div class="actions">
        <button id="capture">Capture current page</button>
        <button id="copy" disabled>Copy markdown</button>
        <button id="download" disabled>Download .md</button>
      </div>

      <textarea id="output" placeholder="Captured content will appear here." spellcheck="false"></textarea>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
